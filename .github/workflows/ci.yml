name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickethub
          POSTGRES_PASSWORD: tickethub_ci_password
          POSTGRES_DB: tickethub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tickethub -d tickethub_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://tickethub:tickethub_ci_password@localhost:5432/tickethub_test
      DB_SSL: 'false'
      DB_LOGGING: 'false'
      DB_POOL_MAX: 10
      SWAGGER_ENABLED: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run database migrations
        run: npm run migration:run

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
